apiVersion: 1
datasources:
  - name: Apparel metrics
    uid: apparel-prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    # Local-only: the alert verifier temporarily simulates/restores a query outage.
    editable: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: apparel-tempo
  - name: Apparel logs
    uid: apparel-loki
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          datasourceUid: apparel-tempo
          url: '${__value.raw}'
  - name: Apparel traces
    uid: apparel-tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
