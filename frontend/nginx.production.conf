limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
log_format safe '$request_method $uri $status';
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout safe;
    client_max_body_size 16k;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/(api/|health$|health/db$) {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        # Variable upstream re-resolves after a backend container restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend:8000;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Replace untrusted incoming forwarding headers, never append them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Server;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
